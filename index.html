<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>only for u </title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <div id="envelope-container">
        <h1 class="envelope-title">hiii special onee</h1>

        <div class="envelope-wrapper" onclick="openEnvelope()">
            <div class="envelope">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="letter">
                    <div class="heart-seal">❤️</div>
                    <p class="click-text">click hereee plss</p>
                </div>
            </div>
        </div>

        <p class="envelope-footer">from: uu knoww whooo</p>
    </div>

    <audio id="bg-music" src="girlinred.mp3" loop></audio>

    <script>
        const music = document.getElementById('bg-music');

        const saveMusicTime = () => {
            if (music && !Number.isNaN(music.currentTime)) {
                localStorage.setItem('musicTime', String(music.currentTime));
            }
        };

        const startAudio = () => {
            music.volume = 0;
            const savedTime = Number(localStorage.getItem('musicTime') || 0);
            if (savedTime > 0) {
                music.currentTime = savedTime;
            }

            music.play().then(() => {
                let fadeInterval = setInterval(() => {
                    if (music.volume < 0.9) {
                        music.volume += 0.1;
                    } else {
                        music.volume = 1;
                        clearInterval(fadeInterval);
                    }
                }, 200);
            }).catch(() => {
                console.log('Autoplay blocked. Waiting for user interaction.');
            });
        };

        music.addEventListener('timeupdate', saveMusicTime);
        music.addEventListener('pause', saveMusicTime);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) saveMusicTime();
        });
        window.addEventListener('beforeunload', saveMusicTime);
        window.addEventListener('pagehide', saveMusicTime);

        function openEnvelope() {
            const envelope = document.getElementById('envelope-container');
            if (envelope) {
                envelope.style.display = 'none';
            }

            saveMusicTime();
            setTimeout(() => {
                window.location.href = 'before-question.html';
            }, 30);
        }

        window.addEventListener('DOMContentLoaded', () => {
            startAudio();
            window.addEventListener('mousemove', startAudio, { once: true });
            window.addEventListener('touchstart', startAudio, { once: true });
            window.addEventListener('click', startAudio, { once: true });
            window.addEventListener('scroll', startAudio, { once: true });
        });
    </script>
</body>

</html>
