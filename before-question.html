<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>only for u </title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <div class="page-card">
        <h1 class="before-question-title">sooo i may have or may have not 'accidentally' liked uu</h1>
        <p class="page-copy">andd i just wannaaa askk a question ive been dying to askk</p>

        <img src="catslinlove.jpg" class="cats">

        <div class="answerbuttons">
            <a href="question.html" id="continue-btn" class="links">continue</a>
        </div>
    </div>

    <audio id="bg-music" src="girlinred.mp3" loop></audio>

    <script>
        const music = document.getElementById('bg-music');
        const continueBtn = document.getElementById('continue-btn');

        const saveMusicTime = () => {
            if (music && !Number.isNaN(music.currentTime)) {
                localStorage.setItem('musicTime', String(music.currentTime));
            }
        };

        document.querySelectorAll('a[href]').forEach((link) => {
            link.addEventListener('click', () => {
                saveMusicTime();
            });
        });

        continueBtn.addEventListener('mouseenter', () => {
            continueBtn.style.transform = 'scale(1.08)';
        });

        continueBtn.addEventListener('mouseleave', () => {
            continueBtn.style.transform = 'scale(1)';
        });

        const startAudio = () => {
            music.volume = 0.5;
            const savedTime = Number(localStorage.getItem('musicTime') || 0);
            if (savedTime > 0) {
                music.currentTime = savedTime;
            }
            music.play().catch(() => {
                window.addEventListener('mousemove', () => music.play(), { once: true });
                window.addEventListener('touchstart', () => music.play(), { once: true });
            });
        };

        music.addEventListener('timeupdate', saveMusicTime);
        music.addEventListener('pause', saveMusicTime);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) saveMusicTime();
        });
        window.addEventListener('beforeunload', saveMusicTime);
        window.addEventListener('pagehide', saveMusicTime);
        window.addEventListener('DOMContentLoaded', startAudio);
        window.addEventListener('click', startAudio, { once: true });
    </script>
</body>

</html>
