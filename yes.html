<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>only for u </title>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <h1>omggg reallyyy ?? im surprised yayyyyy !!</h1>

    <img src="catgiveflower.jpg" class="cats">

    <h2>welllll u knowww where to text mee<br> thankiessss hehe</h2>

    <div class="signature-section">
        <div class="signature-label">sign hereee</div>
        <div class="arrow-row" aria-hidden="true">
            <span class="arrow left">←</span>
            <button id="signature-box" class="signature-box" type="button">
                <span id="signature-text" class="signature-text">sign hereee</span>
            </button>
            <span class="arrow right">→</span>
        </div>
    </div>

    <audio id="bg-music" src="girlinred.mp3" loop></audio>

    <script>
        const music = document.getElementById('bg-music');
        const signatureBox = document.getElementById('signature-box');
        const signatureText = document.getElementById('signature-text');

        const saveMusicTime = () => {
            if (music && !Number.isNaN(music.currentTime)) {
                localStorage.setItem('musicTime', String(music.currentTime));
            }
        };

        signatureBox.addEventListener('click', () => {
            const name = window.prompt('what should i write for your signature?', 'your name');
            const cleanName = name ? name.trim() : '';

            if (cleanName) {
                signatureText.textContent = cleanName;
                signatureText.classList.add('signed');
            }
        });

        const startAudio = () => {
            const savedTime = Number(localStorage.getItem('musicTime') || 0);
            music.volume = 0.5;
            music.preload = 'auto';

            const resumePlayback = () => {
                if (!Number.isNaN(savedTime) && savedTime > 0) {
                    music.currentTime = savedTime;
                }

                music.play().catch(() => {
                    window.addEventListener('mousemove', () => music.play(), { once: true });
                    window.addEventListener('touchstart', () => music.play(), { once: true });
                });
            };

            if (music.readyState >= 1) {
                resumePlayback();
            } else {
                music.addEventListener('loadedmetadata', resumePlayback, { once: true });
                music.load();
            }
        };

        music.addEventListener('timeupdate', saveMusicTime);
        window.addEventListener('beforeunload', saveMusicTime);
        window.addEventListener('pagehide', saveMusicTime);
        window.addEventListener('DOMContentLoaded', startAudio);
        window.addEventListener('click', startAudio, { once: true });
    </script>
</body>

</html>
